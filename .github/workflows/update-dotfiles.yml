name: Update dotfiles on VSCode settings change

on:
  push:
    branches: [ main ]
    paths:
      - '.vscode/**'
      - 'keybinding.jsonc'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  update-dotfiles:
    runs-on: ubuntu-26.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: dotfiles
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout dotfiles
        uses: actions/checkout@v7.0.1
        with:
          repository: naitokosuke/dotfiles
          token: ${{ steps.app-token.outputs.token }}
          
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update flake
        run: |
          nix flake update vscode-settings
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update vscode-settings flake"
          title: "Update vscode-settings flake"
          body: |
            This PR updates the vscode-settings flake input.
            
            Triggered by changes in https://github.com/naitokosuke/vscode-settings
          branch: update-vscode-settings-flake
          delete-branch: true
